
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Study | 学習管理</title>
  <style>
    /* 最初の描画用：外部CSSを待たずに起動画面を表示 */
    html, body { width:100%; min-height:100%; margin:0; background:#f5f7fb; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
    #startup-screen {
      position:fixed; inset:0; z-index:10000; display:grid; place-items:center;
      overflow:hidden; background:radial-gradient(circle at 50% 43%,rgba(226,230,255,.72),transparent 31%),
      linear-gradient(145deg,#fbfcff 0%,#f2f4fc 52%,#f8f9ff 100%);
      opacity:1; visibility:visible;
    }
    #startup-screen .startup-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
    #startup-screen .startup-logo { color:#202944; font-size:clamp(48px,12vw,66px); line-height:1; font-weight:850; letter-spacing:-3.5px; }
    #startup-screen .startup-logo span { color:#7887ed; }
    #startup-screen .startup-caption { margin-top:13px; color:#929bb5; font-size:9px; font-weight:750; letter-spacing:3px; }
    #startup-screen .startup-loader { position:relative; width:142px; height:3px; margin-top:43px; overflow:hidden; border-radius:999px; background:rgba(111,126,205,.13); }
    #startup-screen .startup-loader span { position:absolute; top:0; left:-38%; width:38%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#9aa7f4,#5969d9); animation:startup-loading 1.35s ease-in-out infinite; }
    #startup-screen .startup-message { margin-top:13px; color:#929bb5; font-size:11px; letter-spacing:1.5px; }
    #startup-screen .startup-orbit { position:absolute; left:50%; top:50%; width:min(76vw,330px); aspect-ratio:1; border:1px solid rgba(123,137,218,.12); border-radius:50%; transform:translate(-50%,-50%); }
    #startup-screen .startup-orbit-two { width:min(94vw,410px); border-color:rgba(123,137,218,.075); }
    #startup-screen .startup-spark { position:absolute; width:7px; height:7px; border-radius:2px; background:#aab5ff; box-shadow:0 0 15px rgba(120,136,230,.45); }
    #startup-screen .startup-spark-one { top:34%; left:calc(50% - 116px); }
    #startup-screen .startup-spark-two { top:59%; left:calc(50% + 128px); width:5px; height:5px; }
    #startup-screen .startup-spark-three { top:66%; left:calc(50% - 91px); width:4px; height:4px; }
    @keyframes startup-loading { 0%{left:-38%} 100%{left:100%} }
  </style>
  <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <div id="startup-screen" class="startup-screen" role="status" aria-label="Studyを読み込み中">
    <div class="startup-orbit startup-orbit-one" aria-hidden="true"></div>
    <div class="startup-orbit startup-orbit-two" aria-hidden="true"></div>
    <span class="startup-spark startup-spark-one" aria-hidden="true"></span>
    <span class="startup-spark startup-spark-two" aria-hidden="true"></span>
    <span class="startup-spark startup-spark-three" aria-hidden="true"></span>
    <div class="startup-content">
      <div class="startup-logo">Study<span>.</span></div>
      <div class="startup-caption">PERSONAL LEARNING SPACE</div>
      <div class="startup-loader" aria-hidden="true"><span></span></div>
      <div class="startup-message">準備しています</div>
    </div>
  </div>
  <section id="auth-screen" class="auth-screen" hidden></section>
  <div id="app" hidden>
    <aside class="sidebar">
      <div class="logo">Study<span>.</span></div>
      <nav id="navigation">
        <button type="button" class="nav-item active" data-page="home">ホーム</button>
        <button type="button" class="nav-item" data-page="calendar">カレンダー</button>
        <button type="button" class="nav-item" data-page="tasks">課題管理</button>
        <button type="button" class="nav-item" data-page="todo">TODO</button>
        <button type="button" class="nav-item" data-page="dailyRecord">1日の記録</button>
        <button type="button" class="nav-item" data-page="notifications">通知設定</button>
        <button type="button" class="nav-item" data-page="timetable">時間割</button>
      </nav>
      <div class="sidebar-footer">PERSONAL STUDY SYSTEM</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PERSONAL LEARNING SPACE</div>
          <h1 id="page-title">ホーム</h1>
        </div>
        <div class="topbar-actions">
          <div id="today-label"></div>
          <button type="button" id="logout-button" class="secondary-button">ログアウト</button>
        </div>
      </header>
      <section id="page-content"></section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="notifications.js"></script>
  <script>
    // PWA用Service Workerの登録（オフラインキャッシュは使用しない）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service Workerの登録に失敗しました", error));
      });
    }
  </script>
</body>
</html>
