
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Study | 学習管理</title>
  <style>
    /* 起動画面の最小表示は外部CSSを待たずに描画する */
    html, body { margin: 0; min-height: 100%; background: #f5f7fb; }
    #startup-screen {
      position: fixed; inset: 0; z-index: 10000;
      display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(circle at 50% 43%, rgba(226,230,255,.72), transparent 31%),
                  linear-gradient(145deg, #fbfcff 0%, #f2f4fc 52%, #f8f9ff 100%);
      color: #202944;
    }
    #startup-screen .startup-content { display:flex; flex-direction:column; align-items:center; }
    #startup-screen .startup-logo { font: 850 58px/1 system-ui,-apple-system,sans-serif; letter-spacing:-3.5px; }
    #startup-screen .startup-logo span { color:#7887ed; }
    #startup-screen .startup-caption { margin-top:12px; font:600 10px/1.5 system-ui,sans-serif; letter-spacing:3px; color:#8790ad; }
    #startup-screen .startup-loader { width:112px; height:3px; margin-top:30px; overflow:hidden; border-radius:99px; background:#e2e6f5; }
    #startup-screen .startup-loader span { display:block; width:42%; height:100%; border-radius:99px; background:#7887ed; animation:startup-critical-load 1.25s ease-in-out infinite; }
    #startup-screen .startup-message { margin-top:13px; color:#929ab2; font:500 11px/1.5 system-ui,sans-serif; }
    @keyframes startup-critical-load { 0% { transform:translateX(-110%); } 100% { transform:translateX(270%); } }
    @media (prefers-reduced-motion: reduce) { #startup-screen .startup-loader span { animation:none; } }
  </style>
  <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <div id="startup-screen" class="startup-screen" role="status" aria-label="Studyを読み込み中">
    <div class="startup-orbit startup-orbit-one" aria-hidden="true"></div>
    <div class="startup-orbit startup-orbit-two" aria-hidden="true"></div>
    <span class="startup-spark startup-spark-one" aria-hidden="true"></span>
    <span class="startup-spark startup-spark-two" aria-hidden="true"></span>
    <span class="startup-spark startup-spark-three" aria-hidden="true"></span>
    <div class="startup-content">
      <div class="startup-logo">Study<span>.</span></div>
      <div class="startup-caption">PERSONAL LEARNING SPACE</div>
      <div class="startup-loader" aria-hidden="true"><span></span></div>
      <div class="startup-message">準備しています</div>
    </div>
  </div>
  <section id="auth-screen" class="auth-screen" hidden></section>
  <div id="app" hidden>
    <aside class="sidebar">
      <div class="logo">Study<span>.</span></div>
      <nav id="navigation">
        <button type="button" class="nav-item active" data-page="home">ホーム</button>
        <button type="button" class="nav-item" data-page="calendar">カレンダー</button>
        <button type="button" class="nav-item" data-page="tasks">課題管理</button>
        <button type="button" class="nav-item" data-page="todo">TODO</button>
        <button type="button" class="nav-item" data-page="dailyRecord">1日の記録</button>
        <button type="button" class="nav-item" data-page="notifications">通知設定</button>
        <button type="button" class="nav-item" data-page="timetable">時間割</button>
      </nav>
      <div class="sidebar-footer">PERSONAL STUDY SYSTEM</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PERSONAL LEARNING SPACE</div>
          <h1 id="page-title">ホーム</h1>
        </div>
        <div class="topbar-actions">
          <div id="today-label"></div>
          <button type="button" id="logout-button" class="secondary-button">ログアウト</button>
        </div>
      </header>
      <section id="page-content"></section>
    </main>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script defer src="data.js"></script>
  <script defer src="script.js"></script>
  <script defer src="notifications.js"></script>
  <script>
    // PWA用Service Workerの登録（オフラインキャッシュは使用しない）
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service Workerの登録に失敗しました", error));
      });
    }
  </script>
</body>
</html>
